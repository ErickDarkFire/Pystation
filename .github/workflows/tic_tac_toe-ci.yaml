jobs:
  test-and-coverage:
    runs-on: windows-latest  # <-- Cambiamos de ubuntu a windows

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      working-directory: ./Tic_tac_toe
      run: |
        python -m pip install --upgrade pip
        pip install pygame behave pydirectinput coverage

    - name: Ejecutar Pruebas (Unitarias y BDD)
      working-directory: ./Tic_tac_toe
      run: |
        # En Windows no necesitas xvfb-run, pero la máquina de GitHub
        # debe tener activada la sesión de escritorio (lo hace por defecto)
        coverage run --source=. -m unittest discover -s tests/ -p "test_*.py"
        behave features/
