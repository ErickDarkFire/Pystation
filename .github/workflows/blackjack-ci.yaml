name: Blackjack Coverage and GUI Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk python3-dev xvfb libv4l-dev

    - name: Instalar dependencias de Python
      working-directory: ./blackjack
      run: |
        python -m pip install --upgrade pip
        # Instalar librerías base, cobertura y BDD
        pip install pygame coverage behave

    - name: Ejecutar Pruebas Unitarias
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
        PYTHONPATH: ./blackjack
      run: |
        # Ejecuta los unittests unitarios y mide cobertura inicial
        coverage run --source=./blackjack -m unittest tests.test_card tests.test_hand tests.test_player tests.test_shoe tests.test_ui

    - name: Ejecutar Pruebas de Integración
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
        PYTHONPATH: ./blackjack
      run: |
        # Ejecuta las pruebas de integración y añade a la cobertura
        coverage run -a --source=./blackjack -m unittest tests.test_integration

    - name: Ejecutar Pruebas BDD (Interfaz)
      env:
        SDL_VIDEODRIVER: dummy
        SDL_AUDIODRIVER: dummy
        PYTHONPATH: ./blackjack
      run: |
        # Ejecuta las pruebas BDD y añade a la cobertura
        coverage run -a --source=./blackjack -m behave blackjack/features/

    - name: Validar que la cobertura no baje de la meta
      run: coverage report -m --fail-under=85
