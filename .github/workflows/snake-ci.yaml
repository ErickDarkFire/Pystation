name: Snake - CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "snake/**"

defaults:
  run:
    working-directory: snake

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: snake/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t .

      - name: Run integration tests
        run: python -m unittest discover -s integration_tests -t .

      - name: Measure base branch coverage
        id: base
        run: |
          git checkout origin/${{ github.base_ref }} -- .
          coverage run --rcfile=.coveragerc -m unittest discover -s tests -t .
          BASE=$(coverage report --rcfile=.coveragerc | awk '/^TOTAL/ {print $NF}' | tr -d '%')
          echo "pct=${BASE}" >> "$GITHUB_OUTPUT"
          git checkout HEAD -- .

      - name: Measure PR coverage
        id: pr
        run: |
          coverage run --rcfile=.coveragerc -m unittest discover -s tests -t .
          coverage report --rcfile=.coveragerc -m

          PR=$(coverage report --rcfile=.coveragerc | awk '/^TOTAL/ {print $NF}' | tr -d '%')
          echo "pct=${PR}" >> "$GITHUB_OUTPUT"

      - name: Check coverage did not decrease
        run: |
          python - <<EOF
          import sys
          base = float("${{ steps.base.outputs.pct }}")
          pr   = float("${{ steps.pr.outputs.pct }}")
          print(f"Base: {base:.1f}%  PR: {pr:.1f}%  Diff: {pr - base:+.1f}pp")
          if pr < base:
              print("Coverage decreased. Failing.")
              sys.exit(1)
          EOF
