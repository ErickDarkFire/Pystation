name: CI

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 coverage pytest pytest-cov

      - name: Run linter
        run: |
          flake8 .

      - name: Coverage — Blackjack
        run: |
          echo "=== Blackjack ==="
          coverage run --source=blackjack -m unittest discover -s blackjack -t blackjack
          coverage report -m --fail-under=85

      - name: Coverage — Craps
        working-directory: craps
        run: |
          echo "=== Craps ==="
          coverage run --source=. tests/unittests.py
          coverage report -m

      - name: Coverage — Poker
        working-directory: poker
        run: |
          echo "=== Poker ==="
          pytest tests/ --cov=. --cov-report=term-missing

      - name: Coverage — Pong
        run: |
          echo "=== Pong ==="
          coverage run --source=pong -m unittest discover -s pong/tests -t pong
          coverage report -m
