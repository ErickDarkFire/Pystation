name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-dev xvfb libv4l-dev

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 coverage pytest pytest-cov behave pydirectinput

      - name: Run linter
        run: |
          # Excluimos carpetas de caché y entornos virtuales
          flake8 . --exclude=venv,__pycache__

      - name: Coverage — Blackjack
        run: |
          echo "=== Blackjack ==="
          coverage run --source=blackjack -m unittest discover -s blackjack -t blackjack
          coverage report -m --fail-under=85

      - name: Coverage — Craps
        working-directory: craps
        run: |
          echo "=== Craps ==="
          coverage run --source=. tests/unittests.py
          coverage report -m

      - name: Coverage — Poker
        working-directory: poker
        run: |
          echo "=== Poker ==="
          pytest tests/ --cov=. --cov-report=term-missing

      - name: Coverage — Pong
        run: |
          echo "=== Pong ==="
          coverage run --source=pong -m unittest discover -s pong/tests -t pong
          coverage report -m

      - name: Coverage — Tic Tac Toe (Unittest)
        run: |
          echo "=== Tic Tac Toe: Unit Tests ==="
          # Se ejecutan las pruebas de lógica desde la carpeta de tests
          coverage run --source=Tic_tac_toe -m unittest discover -s Tic_tac_toe/tests -p "test_*.py"
          coverage report -m

      - name: BDD Tests — Tic Tac Toe (GUI Automation)
        # xvfb-run permite que pydirectinput y pygame interactúen en un monitor virtual
        run: |
          echo "=== Tic Tac Toe: BDD con PyDirectInput ==="
          xvfb-run --server-args="-screen 0 1024x768x24" behave Tic_tac_toe/features