name: Poker Coverage Check

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      working-directory: ./poker
      run: |
        python -m pip install --upgrade pip
        # Instalar librerías del juego y de pruebas
        pip install pygame pytest coverage

    - name: Ejecutar Pruebas Unitarias y Medir Cobertura
      working-directory: ./poker
      run: coverage run -m pytest tests/

    - name: Validar que la cobertura no baje de la meta
      working-directory: ./poker

      run: coverage report -m --fail-under=85